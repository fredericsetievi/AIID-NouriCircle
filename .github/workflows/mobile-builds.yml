name: Mobile builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'mobile/android/**'
      - 'mobile/ios/**'
      - 'package*.json'
      - '.github/workflows/mobile-builds.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies and sync app
        run: |
          npm ci
          npm run mobile:sync
      - name: Build installable debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: nouricircle-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS simulator app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and sync app
        run: |
          npm ci
          npm run mobile:sync
      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/nouricircle-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/nouricircle-ios/Build/Products/Debug-iphonesimulator/App.app" \
            "$RUNNER_TEMP/nouricircle-ios-simulator.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: nouricircle-ios-simulator-app
          path: ${{ runner.temp }}/nouricircle-ios-simulator.zip
          if-no-files-found: error

  publish_android:
    name: Publish Android download
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: nouricircle-mobile-downloads
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          name: nouricircle-android-debug-apk
          path: ${{ runner.temp }}/android-apk
      - name: Replace the downloadable APK
        env:
          BUILT_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          # A newer app source should be built by its own run, not replaced by this older APK.
          if ! git diff --quiet "$BUILT_SHA" origin/main -- web mobile/android capacitor.config.ts package.json package-lock.json vite.config.ts .github/workflows/mobile-builds.yml; then
            echo "Newer app source is on main; skipping this older APK."
            exit 0
          fi
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/android-apk/app-debug.apk" mobile/downloads/NouriCircle-Android-debug.apk
          git add mobile/downloads/NouriCircle-Android-debug.apk
          if git diff --cached --quiet; then
            echo "APK has not changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Android test APK"
          git push origin HEAD:main
